    <script type="text/javascript">
      // Single Page Apps for GitHub Pages routing restoration
      (function(l) {
        if (l.search) {
          var q = {};
          l.search.slice(1).split('&').forEach(function(v) {
            var k = v.split('=');
            q[k[0]] = k[1] && decodeURIComponent(k[1].replace(/\+/g, ' '));
          });
          if (q.p !== undefined) {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (q.p || '') +
              (q.q ? ('?' + q.q) : '') +
              l.hash
            );
          }
        }
      }(window));
    </script>
