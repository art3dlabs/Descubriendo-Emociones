<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Descubriendo Emociones - Redirigiendo...</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages (rafgraph/spa-github-pages)
      var pathSegmentsToKeep = 1; // Change to 0 if using a custom domain (e.g. yourdomain.com)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="text-align: center; font-family: sans-serif; margin-top: 50px;">
      <h2>Redirigiendo a Descubriendo Emociones...</h2>
    </div>
  </body>
</html>
